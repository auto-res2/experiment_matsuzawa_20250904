experiment_1:
  name: "Waterbirds – Sub-population shift without group labels"
  dataset: waterbirds
  splits: {train: 3495, val: 349, test: 951}
  backbone: resnet50_in21k
  head_hidden: 1024
  epochs: 30
  batch_size: 128
  optimizer: {type: adamw, lr: 3e-4, betas: [0.9, 0.999], weight_decay: 0.05}
  scheduler: {type: cosine, warmup_epochs: 2}
  autospu:
    enabled: true
    lambda_consistency: 1.0
    lambda_fourier: 0.3
    swap_prob: 1.0
    fourier_cfg: {phase_max: 0.2, amp_min: 0.5, amp_max: 1.5}
    precompute_masks: true
    last_layer_retrain: {enabled: true, samples: 400, lr: 5e-4, batch: 64, epochs: 1}
  seeds: [0, 1, 2, 3, 4]

experiment_2:
  name: "MetaCoCo – Few-shot open-world spuriousness"
  dataset: metacoco
  meta: true
  shots: [1, 5]
  episodes_per_epoch: 2000
  epochs: 15
  backbone: conv4
  autospu:
    enabled: true
    lambda_consistency: 1.0
    lambda_fourier: 0.0
    swap_prob: 0.8
    fourier_cfg: {phase_max: 0.0}
    precompute_masks: false
    last_layer_retrain: {enabled: false}
  seeds: [11, 12, 13]

experiment_3:
  name: "PACS/OfficeHome/CIFAR-10-C – Broad robustness"
  dataset: multi
  datasets: [pacs, officehome, cifar10c]
  backbone: vit_b16_in21k
  epochs: 50
  batch_size: 64
  optimizer: {type: adamw, lr: 5e-5, weight_decay: 0.05}
  scheduler: {type: cosine, warmup_epochs: 5}
  autospu:
    enabled: true
    lambda_consistency: 1.0
    lambda_fourier: 0.5
    swap_prob: 1.0
    fourier_cfg: {phase_max: 0.2, amp_min: 0.5, amp_max: 1.5}
    diffusion_inpaint: {enabled: true, prob: 0.3, model: "stabilityai/stable-diffusion-2-inpainting"}
  seeds: [21, 22]
