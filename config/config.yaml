dataset:
  root_dir: data
  waterbirds:
    version: 1.0  # v2.0 is not yet supported by the `wilds` package
    masks_npz: masks_npz/waterbirds_masks_224.npz
    url: https://dl.fbaipublicfiles.com/wilds/waterbirds_v1.0.tgz
model:
  backbone: resnetv2_50x1_bit.goog_in21k_ft_in1k
  num_classes: 2
training:
  epochs: 30
  batch_size: 128
  lr: 3e-4
  weight_decay: 0.05
  seeds: [0, 1, 2, 3, 4]
autospu:
  swap_prob: 1.0
  lambda_consistency: 1.0
  lambda_fourier: 0.3
