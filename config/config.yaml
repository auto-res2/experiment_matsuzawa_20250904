dataset:
  waterbirds:
    version: 2.0
    root_dir: data
model:
  name: resnetv2_50x1_bit.goog_in21k_ft_in1k
  pretrained: true
training:
  epochs: 30
  batch_size: 128
  lr: 3e-4
  weight_decay: 0.05
  seeds:
    waterbirds: [0, 1, 2, 3, 4]
loss:
  autospu:
    lambda_consistency: 1.0
    lambda_fourier: 0.3
