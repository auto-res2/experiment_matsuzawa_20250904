common:
  device: auto          # "auto" selects CUDA if available, else CPU
  mixed_precision: true
  seeds: [11, 22, 33, 44, 55]
  optimizer:
    name: Adam
    lr: 0.003
    weight_decay: 0.0005
    betas: [0.9, 0.999]
  scheduler:
    name: cosine
    T_max: 200
  early_stop_patience: 50
  log_every: 5
  data_root: ./data
  output_root: ./.research/iteration1/images

datasets:
  cora:
    loader: planetoid
  citeseer:
    loader: planetoid
  pubmed:
    loader: planetoid
  ogbn-arxiv:
    loader: ogb
  ogbn-papers100M:
    loader: ogb

experiments:
  exp1_depth_robust:
    description: Depth-robust accuracy & over-smoothing profile (Exp-1)
    datasets: [cora, citeseer, pubmed, ogbn-arxiv]
    depths: [2, 4, 8, 16, 32, 64, 128]
    models: [AdaPropGCN, GCN, SGC, DropEdgeGCN, PairNormGCN, DGN, NDLS]
    epochs: 300
  exp2_node_adapt:
    description: Per-node adaptivity under local noise (Exp-2)
    datasets: [pubmed]
    depths: [32]
    noise_fraction: 0.30
    noise_sigma: 1.0
    models: [AdaPropGCN, UniformPi, LayerWisePi, DropEdgeGCN]
    epochs: 300
  exp3_scalability:
    description: Regularizer ablation & scalability to 100M nodes (Exp-3)
    datasets: [ogbn-papers100M]
    depths: [10]
    models: [AdaPropGCN_full, AdaPropGCN_no_reg, AdaPropGCN_weak_reg, SGC]
    epochs: 40

hyper:
  hidden_dim_small: 64
  hidden_dim_large: 128
  K: 10
  lambda: 0.2
  dropedge_p: 0.2
